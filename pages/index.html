<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUNCH Glasgow — Underground Gig & Nightlife Discovery</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              yellow: '#FACC15',
              dark: '#030712',
              card: '#111827',
              border: '#1F2937'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #030712; color: #F9FAFB; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-yellow-400 selection:text-black">

  <!-- HEADER -->
  <header class="border-b border-gray-800 bg-gray-950/80 backdrop-blur sticky top-0 z-40 px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="resetFilters()">
        <div class="h-9 w-9 rounded-lg bg-yellow-400 text-black font-black flex items-center justify-center text-xl tracking-tighter">
          C!
        </div>
        <div>
          <h1 class="text-xl font-black text-gray-100 tracking-tight leading-none">
            CRUNCH <span class="text-yellow-400 font-light">GLASGOW</span>
          </h1>
          <p class="text-[10px] text-gray-400 uppercase tracking-widest mt-0.5">Independent Gig & Nightlife Guide</p>
        </div>
      </div>
      <button onclick="toggleModal('add-event-modal')" class="bg-yellow-400 hover:bg-yellow-300 text-black text-xs font-bold px-3.5 py-2 rounded-lg transition-colors flex items-center gap-1.5 shadow-lg shadow-yellow-400/10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        <span>List Your Event</span>
      </button>
    </div>
  </header>

  <!-- HERO & SEARCH SECTION -->
  <section class="border-b border-gray-800 bg-gradient-to-b from-gray-950 via-gray-900 to-gray-950 px-4 py-8">
    <div class="max-w-6xl mx-auto">
      <div class="max-w-2xl mb-6">
        <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-gray-100">
          No corporate bloat.<br/>Just pure <span class="text-yellow-400">Glasgow culture.</span>
        </h2>
        <p class="text-gray-400 text-sm mt-2">Discover live music, underground club nights, DIY shows, and local arts across the city with transparent 50p booking fees.</p>
      </div>

      <!-- Filters & Search Bar -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div class="relative sm:col-span-1">
          <input type="text" id="search-input" onkeyup="filterEvents()" placeholder="Search bands, DJs, venues..." class="w-full bg-gray-900 border border-gray-800 rounded-lg px-3.5 py-2.5 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-yellow-400 transition-colors" />
        </div>
        <div>
          <select id="area-filter" onchange="filterEvents()" class="w-full bg-gray-900 border border-gray-800 rounded-lg px-3.5 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-yellow-400 transition-colors">
            <option value="all">All Neighborhoods</option>
            <option value="West End">West End (Finnieston/Partick)</option>
            <option value="City Centre">City Centre</option>
            <option value="Southside">Southside (Govanhill/Shawlands)</option>
            <option value="East End">East End (Dennistoun)</option>
          </select>
        </div>
