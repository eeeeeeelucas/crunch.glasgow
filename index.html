<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050b14" />
    <meta name="description" content="Find what’s on in Glasgow: live music, club nights, comedy, theatre, art workshops, life drawing and local makers’ markets. Browse upcoming events by date and neighbourhood." />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://www.glasgow.cool/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CRUNCH Glasgow" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="What’s On in Glasgow | Events, Gigs & Workshops | CRUNCH" />
    <meta property="og:description" content="Discover upcoming Glasgow gigs, comedy, theatre, club nights, creative workshops and local markets." />
    <meta property="og:url" content="https://www.glasgow.cool/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="What’s On in Glasgow | CRUNCH" />
    <meta name="twitter:description" content="Find upcoming Glasgow events, gigs, theatre, workshops and local markets." />
    <title>What’s On in Glasgow | Events, Gigs & Workshops | CRUNCH</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CRUNCH Glasgow",
        "url": "https://www.glasgow.cool/",
        "description": "A guide to upcoming live music, club nights, comedy, theatre, workshops and creative events in Glasgow.",
        "inLanguage": "en-GB",
        "publisher": {
          "@type": "Organization",
          "name": "CRUNCH Glasgow",
          "url": "https://www.glasgow.cool/"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050b14;
        --panel: #0a1424;
        --panel-raised: #0d192b;
        --border: #1a2d49;
        --pink: #ff2a6d;
        --lime: #b8ff40;
        --yellow: #facc15;
        --muted: #929bad;
        --text: #f4f6fa;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 16px 16px 92px; background: #000; color: var(--text); }
      button, input { font: inherit; }
      button { color: inherit; }
      .shell { width: min(100%, 560px); min-height: calc(100vh - 108px); margin: 0 auto; overflow: hidden; border: 1px solid #101a29; border-radius: 30px; background: var(--bg); box-shadow: 0 20px 70px #0008; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
      .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .brand-mark { display: grid; width: 44px; height: 44px; flex: 0 0 auto; place-items: center; overflow: hidden; border-radius: 14px; background: var(--pink); box-shadow: 0 0 24px #ff2a6d4d; }
      .brand-mark svg { display: block; width: 100%; height: 100%; }
      .brand-name { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: .12em; white-space: nowrap; }
      .brand-name span { color: var(--pink); }
      .brand-subtitle { margin: 4px 0 0; color: #a0a8b6; font-size: 10px; letter-spacing: .12em; }
      .submit { flex: 0 0 auto; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text); font-size: 11px; font-weight: 800; cursor: pointer; }
      .submit:hover, .submit:focus-visible { border-color: var(--pink); outline: none; }
      .category-wrap { position: sticky; top: 0; z-index: 2; padding: 10px 18px; border-bottom: 1px solid var(--border); background: #050b14f2; }
      .categories { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
      .categories::-webkit-scrollbar { display: none; }
      .category { flex: 0 0 auto; padding: 9px 13px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: #a7b0c0; font-size: 11px; font-weight: 800; text-transform: uppercase; white-space: nowrap; cursor: pointer; }
      .category[aria-pressed="true"] { border-color: var(--pink); background: var(--pink); color: #080b11; }
      .feed { padding: 18px; }
      .seo-intro { margin: 0 0 16px; }
      .seo-intro h1 { margin: 0 0 6px; color: var(--text); font-size: 18px; line-height: 1.25; letter-spacing: -.03em; }
      .seo-intro p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
      .search { display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
      .search span { color: var(--muted); font-size: 18px; }
      .search input { width: 100%; min-width: 0; padding: 14px 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 13px; }
      .search input::placeholder { color: #5f6a7c; }
      .active-filters { display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; }
      .active-filters[hidden] { display: none; }
      .filter-caption { flex: 0 0 auto; padding-top: 7px; color: var(--lime); font-size: 9px; font-weight: 800; letter-spacing: .08em; }
      .filter-chips { display: flex; flex: 1 1 auto; flex-wrap: wrap; gap: 6px; min-width: 0; }
      .filter-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 28px; padding: 4px 6px 4px 9px; border: 1px solid #b8ff4055; border-radius: 6px; background: #b8ff4012; color: #d9f4aa; font-size: 10px; font-weight: 700; line-height: 1.2; }
      .filter-chip-label { max-width: clamp(100px, 48vw, 240px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .filter-remove { display: grid; width: 18px; height: 18px; flex: 0 0 auto; place-items: center; border: 0; border-radius: 4px; background: transparent; color: var(--lime); font-size: 15px; line-height: 1; cursor: pointer; }
      .filter-remove:hover, .filter-remove:focus-visible { background: #b8ff4020; outline: 1px solid var(--lime); }
      .feed-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 18px 0 14px; color: #929bad; font-size: 11px; font-weight: 800; letter-spacing: .09em; }
      .feed-heading strong { color: var(--yellow); font-size: 12px; white-space: nowrap; }
      .feed-state { margin: 12px 0; padding: 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: #b8c0cd; font-size: 12px; line-height: 1.6; }
      .feed-state[hidden] { display: none; }
      .retry { margin-left: 8px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 5px; background: transparent; color: var(--pink); cursor: pointer; }
      .event-list { display: grid; gap: 18px; }
      .event-card { overflow: hidden; border: 1px solid var(--border); border-radius: 9px; background: var(--panel); }
      .event-art { position: relative; height: 210px; overflow: hidden; background: #101d30; }
      .event-art img { width: 100%; height: 100%; object-fit: cover; }
      .event-art::after { position: absolute; inset: 45% 0 0; background: linear-gradient(transparent, #0005); content: ""; pointer-events: none; }
      .badge { position: absolute; z-index: 1; top: 12px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; background: #050b14e8; font-size: 10px; }
      .badge-category { left: 12px; color: var(--pink); font-weight: 800; text-transform: uppercase; }
      .badge-area { right: 12px; color: #e2e7ee; }
      .event-body { padding: 15px; }
      .event-date { margin: 0 0 8px; color: var(--pink); font-size: 12px; font-weight: 800; }
      .event-title { margin: 0 0 8px; font-size: 19px; line-height: 1.3; letter-spacing: .01em; }
      .event-venue { margin: 0 0 9px; color: #a4adbb; font-size: 13px; }
      .event-description { margin: 0; color: #818b9b; font-size: 12px; line-height: 1.6; }
      .event-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 15px; border-top: 1px solid var(--border); }
      .event-source { color: #8993a3; font-size: 10px; }
      .ticket-link { display: inline-flex; align-items: center; justify-content: center; min-width: 112px; padding: 9px 12px; border: 1px solid var(--pink); border-radius: 6px; background: var(--pink); color: #080b11; font-size: 12px; font-weight: 900; text-decoration: none; text-transform: uppercase; }
      .ticket-link:hover, .ticket-link:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      .load-more { display: block; width: 100%; margin-top: 16px; padding: 12px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel); color: var(--pink); font-size: 11px; font-weight: 800; cursor: pointer; }
      .load-more:hover, .load-more:focus-visible { border-color: var(--pink); outline: none; }
      .load-more[hidden] { display: none; }
      .feed-note { margin: 18px 0 2px; color: #626e80; font-size: 10px; line-height: 1.6; text-align: center; }
      .calendar-view { padding: 18px; }
      .calendar-view[hidden] { display: none; }
      .calendar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
      .calendar-head h2 { margin: 0; color: var(--pink); font-size: 13px; letter-spacing: .08em; }
      .calendar-month-controls { display: flex; align-items: center; gap: 8px; }
      .calendar-month { color: #a7b0c0; font-size: 11px; text-align: center; }
      .calendar-month-button { display: grid; width: 30px; height: 30px; place-items: center; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: #cbd2dd; font-size: 18px; line-height: 1; cursor: pointer; }
      .calendar-month-button:hover:not(:disabled), .calendar-month-button:focus-visible { border-color: var(--pink); outline: none; }
      .calendar-month-button:disabled { color: #586273; cursor: default; }
      .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
      .weekday, .day { display: grid; min-height: 37px; place-items: center; border-radius: 6px; font-size: 11px; }
      .weekday { color: #7f8999; font-weight: 800; }
      .day { border: 1px solid transparent; background: var(--panel); cursor: pointer; }
      .day:disabled { background: transparent; cursor: default; }
      .day.has-events { border-color: #50304a; color: var(--pink); }
      .day[aria-pressed="true"] { border-color: var(--pink); background: var(--pink); color: #080b11; }
      .date-clear { margin-top: 14px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: #cbd2dd; font-size: 11px; cursor: pointer; }
      .bottom-nav { position: fixed; z-index: 3; right: 16px; bottom: 0; left: 16px; display: flex; justify-content: center; border-top: 1px solid var(--border); background: #050b14f2; backdrop-filter: blur(10px); }
      .bottom-nav-inner { display: flex; width: min(100%, 560px); justify-content: space-evenly; padding: 10px 0 max(10px, env(safe-area-inset-bottom)); }
      .nav-button { display: grid; gap: 4px; justify-items: center; padding: 2px 20px; border: 0; background: transparent; color: #7f8999; font-size: 10px; letter-spacing: .08em; cursor: pointer; }
      .nav-button[aria-current="page"] { color: var(--pink); }
      .nav-icon { font-size: 21px; line-height: 1; }
      @media (min-width: 620px) {
        body { padding-top: 24px; }
        .shell { min-height: calc(100vh - 140px); }
        .event-art { height: 260px; }
      }
      @media (max-width: 380px) {
        body { padding: 8px 8px 84px; }
        .shell { border-radius: 22px; }
        .topbar, .feed, .calendar-view { padding-right: 12px; padding-left: 12px; }
        .category-wrap { padding-right: 12px; padding-left: 12px; }
        .event-art { height: 185px; }
        .event-title { font-size: 17px; }
        .bottom-nav { right: 8px; left: 8px; }
      }
      @media (prefers-reduced-motion: no-preference) {
        .event-card { animation: appear .25s ease-out both; }
        @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 44 44" focusable="false">
              <path d="M 28.8 13.5 C 26.7 11.7 24.2 10.8 21.4 10.8 C 14.8 10.8 10.2 15.7 10.2 22 C 10.2 28.3 14.8 33.2 21.4 33.2 C 24.2 33.2 26.7 32.3 28.8 30.5" fill="none" stroke="#05070b" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M35 12.5v13" fill="none" stroke="#05070b" stroke-width="5.6" stroke-linecap="round" />
              <circle cx="35" cy="31.8" r="2.8" fill="#05070b" />
            </svg>
          </span>
          <div>
            <p class="brand-name">CRUNCH<span>.GLASGOW</span></p>
            <p class="brand-subtitle">GLASGOW EVENTS &amp; NIGHTLIFE</p>
          </div>
        </div>
        <button class="submit" id="refresh-button" type="button">↻ REFRESH</button>
      </header>

      <nav class="category-wrap" aria-label="Filter events by category">
        <div class="categories" id="category-bar">
          <button class="category" type="button" data-category="All" aria-pressed="true">All</button>
          <button class="category" type="button" data-category="Live Music" aria-pressed="false">Live Music</button>
          <button class="category" type="button" data-category="Clubs" aria-pressed="false">Club Nights</button>
          <button class="category" type="button" data-category="Theatre" aria-pressed="false">Theatre</button>
          <button class="category" type="button" data-category="Comedy" aria-pressed="false">Comedy</button>
          <button class="category" type="button" data-category="Workshops" aria-pressed="false">Workshops</button>
        </div>
      </nav>

      <section class="feed" id="home-view" aria-label="Upcoming Glasgow events">
        <header class="seo-intro">
          <h1>What’s on in Glasgow</h1>
        </header>
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <span class="sr-only" hidden>Search events</span>
          <input id="search-input" type="search" aria-label="Search band, venue, or area" placeholder="// Search band, venue, area..." autocomplete="off" />
        </label>
        <div class="active-filters" id="active-filters" role="region" aria-label="Active filters" hidden>
          <span class="filter-caption">ACTIVE FILTERS</span>
          <div class="filter-chips" id="filter-chips"></div>
        </div>
        <div class="feed-heading">
          <span id="feed-heading">// UPCOMING GLASGOW LISTINGS</span>
          <strong id="event-count">LOADING</strong>
        </div>
        <p class="feed-state" id="feed-state" role="status" aria-live="polite">Loading live event listings…</p>
        <div class="event-list" id="events-grid" aria-live="polite"></div>
        <button class="load-more" id="load-more" type="button" hidden>SHOW MORE EVENTS</button>
        <p class="feed-note">Live venue feeds refresh every 15 minutes. Workshop and market dates are curated from organiser listings.</p>
      </section>

      <section class="calendar-view" id="calendar-view" aria-label="Event calendar" hidden>
        <div class="calendar-head">
          <h2>// PICK A DATE</h2>
          <div class="calendar-month-controls" aria-label="Calendar month">
            <button class="calendar-month-button" id="calendar-prev" type="button" aria-label="Previous month">‹</button>
            <span class="calendar-month" id="calendar-month" aria-live="polite"></span>
            <button class="calendar-month-button" id="calendar-next" type="button" aria-label="Next month">›</button>
          </div>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
        <button class="date-clear" id="clear-date" type="button">CLEAR DATE FILTER</button>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <div class="bottom-nav-inner">
        <button class="nav-button" id="nav-home" type="button" aria-current="page">
          <span class="nav-icon" aria-hidden="true">⌂</span><span>HOME</span>
        </button>
        <button class="nav-button" id="nav-calendar" type="button">
          <span class="nav-icon" aria-hidden="true">▦</span><span>CALENDAR</span>
        </button>
      </div>
    </nav>

    <script>
      const eventsGrid = document.getElementById('events-grid');
      const feedState = document.getElementById('feed-state');
      const eventCount = document.getElementById('event-count');
      const searchInput = document.getElementById('search-input');
      const activeFilters = document.getElementById('active-filters');
      const filterChips = document.getElementById('filter-chips');
      const categoryButtons = [...document.querySelectorAll('[data-category]')];
      const loadMoreButton = document.getElementById('load-more');
      const pageSize = 24;
      const today = new Date();
      const calendarStart = new Date(today.getFullYear(), today.getMonth(), 1);
      const calendarEnd = new Date(today.getFullYear(), today.getMonth() + 6, 1);
      let calendarCursor = new Date(calendarStart);
      let visibleLimit = pageSize;
      let events = [];
      const activeCategories = new Set();
      let selectedDate = '';

      function categoryFor(event) {
        const text = `${event.category || ''} ${event.title}`.toLowerCase();
        if (/workshop|masterclass|life.?drawing|pottery|ceramic|art session|drawing club|illustration|animation|(?:art|craft)\s+fair|(?:winter|craft|makers?)\s+market|flea market/.test(text)) return 'Workshops';
        if (/comedy|stand.?up|comedian|comic/.test(text)) return 'Comedy';
        if (/theatre|theater|play\b|musical|opera|ballet|pantomime/.test(text)) return 'Theatre';
        if (/class\b/.test(text)) return 'Workshops';
        if (/\bclubs?\b|\bdj\b|rave|techno|house music|dance night|disco/.test(text)) return 'Clubs';
        return 'Live Music';
      }

      function formatDate(dateISO, time) {
        const [year, month, day] = dateISO.split('-').map(Number);
        const date = new Date(year, month - 1, day, 12);
        const label = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).format(date);
        return time ? `${label} · ${time}` : `${label} · TIME TBC`;
      }

      function visibleEvents() {
        const query = searchInput.value.trim().toLowerCase();
        return events.filter((event) => {
          const matchesCategory = activeCategories.size === 0 || activeCategories.has(categoryFor(event));
          const matchesDate = !selectedDate || event.dateISO === selectedDate;
          const haystack = `${event.title} ${event.venue} ${event.area || ''} ${event.description || ''}`.toLowerCase();
          return matchesCategory && matchesDate && (!query || haystack.includes(query));
        });
      }

      function formatFilterDate(dateISO) {
        const [year, month, day] = dateISO.split('-');
        return `${day}/${month}/${year.slice(-2)}`;
      }

      function appendFilterChip(label, filterName, onRemove) {
        const chip = document.createElement('span');
        chip.className = 'filter-chip';
        const chipLabel = document.createElement('span');
        chipLabel.className = 'filter-chip-label';
        chipLabel.textContent = label;
        const removeButton = document.createElement('button');
        removeButton.className = 'filter-remove';
        removeButton.type = 'button';
        removeButton.setAttribute('aria-label', `Remove ${filterName} filter`);
        removeButton.textContent = '×';
        removeButton.addEventListener('click', onRemove);
        chip.append(chipLabel, removeButton);
        filterChips.append(chip);
      }

      function syncCategoryButtons() {
        categoryButtons.forEach((button) => {
          const isAll = button.dataset.category === 'All';
          const isSelected = isAll ? activeCategories.size === 0 : activeCategories.has(button.dataset.category);
          button.setAttribute('aria-pressed', String(isSelected));
        });
      }

      function renderActiveFilters() {
        filterChips.replaceChildren();

        activeCategories.forEach((category) => {
          const activeButton = categoryButtons.find((button) => button.dataset.category === category);
          const label = activeButton?.textContent.trim() || category;
          appendFilterChip(label, label, () => {
            activeCategories.delete(category);
            syncCategoryButtons();
            renderCalendar();
            renderEvents();
          });
        });

        if (selectedDate) {
          appendFilterChip(formatFilterDate(selectedDate), 'date', () => {
            selectedDate = '';
            renderCalendar();
            renderEvents();
          });
        }

        const query = searchInput.value.trim();
        if (query) {
          appendFilterChip(`SEARCH · ${query}`, 'search', () => {
            searchInput.value = '';
            renderEvents();
          });
        }

        activeFilters.hidden = filterChips.childElementCount === 0;
      }

      function renderEvents() {
        renderActiveFilters();
        const filtered = visibleEvents();
        eventCount.textContent = `${filtered.length} ${filtered.length === 1 ? 'ITEM' : 'ITEMS'}`;
        eventsGrid.replaceChildren();

        if (!filtered.length) {
          loadMoreButton.hidden = true;
          feedState.hidden = false;
          feedState.textContent = selectedDate ? 'No events found for this date.' : 'No upcoming events match those filters.';
          return;
        }

        feedState.hidden = true;
        const visibleCards = filtered.slice(0, visibleLimit);
        loadMoreButton.hidden = filtered.length <= visibleLimit;
        loadMoreButton.textContent = `SHOW MORE EVENTS · ${filtered.length - visibleCards.length} REMAINING`;
        visibleCards.forEach((event) => {
          const card = document.createElement('article');
          card.className = 'event-card';

          const artwork = document.createElement('div');
          artwork.className = 'event-art';
          if (event.image) {
            const image = document.createElement('img');
            image.src = event.image;
            image.alt = `${event.title} at ${event.venue}`;
            image.loading = 'lazy';
            image.decoding = 'async';
            artwork.append(image);
          }

          const category = document.createElement('span');
          category.className = 'badge badge-category';
          category.textContent = categoryFor(event);
          const area = document.createElement('span');
          area.className = 'badge badge-area';
          area.textContent = event.area || 'Glasgow';
          artwork.append(category, area);

          const body = document.createElement('div');
          body.className = 'event-body';
          const date = document.createElement('p');
          date.className = 'event-date';
          date.textContent = formatDate(event.dateISO, event.time);
          const title = document.createElement('h2');
          title.className = 'event-title';
          title.textContent = event.title;
          const venue = document.createElement('p');
          venue.className = 'event-venue';
          venue.textContent = `⌖  ${event.venue}`;
          const description = document.createElement('p');
          description.className = 'event-description';
          description.textContent = event.description || `Official listing from ${event.source}. Check the venue page for event details and availability.`;
          body.append(date, title, venue, description);

          const footer = document.createElement('div');
          footer.className = 'event-footer';
          const source = document.createElement('span');
          source.className = 'event-source';
          source.textContent = `SOURCE · ${event.source}`;
          const link = document.createElement('a');
          link.className = 'ticket-link';
          link.href = event.ticketUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'EVENT INFO';
          footer.append(source, link);
          card.append(artwork, body, footer);
          eventsGrid.append(card);
        });
      }

      async function loadEvents() {
        const refresh = document.getElementById('refresh-button');
        refresh.disabled = true;
        refresh.textContent = '↻ LOADING';
        feedState.hidden = false;
        feedState.textContent = 'Loading live event listings…';
        try {
          const response = await fetch('/api/events', { headers: { Accept: 'application/json' } });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Could not load event listings.');
          events = Array.isArray(result.events) ? result.events : [];
          if (!events.length) {
            eventCount.textContent = '0 ITEMS';
            feedState.textContent = result.message || 'No upcoming listings were found on the connected venue pages.';
            eventsGrid.replaceChildren();
          } else {
            feedState.hidden = true;
            renderEvents();
          }
        } catch (error) {
          events = [];
          eventCount.textContent = '—';
          eventsGrid.replaceChildren();
          loadMoreButton.hidden = true;
          feedState.replaceChildren(document.createTextNode('Live listings are temporarily unavailable. '));
          const retry = document.createElement('button');
          retry.className = 'retry';
          retry.type = 'button';
          retry.textContent = 'TRY AGAIN';
          retry.addEventListener('click', loadEvents);
          feedState.append(retry);
          feedState.hidden = false;
          console.error('Unable to load the Glasgow event feed:', error);
        } finally {
          refresh.disabled = false;
          refresh.textContent = '↻ REFRESH';
        }
      }

      function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        const year = calendarCursor.getFullYear();
        const month = calendarCursor.getMonth();
        const monthName = new Intl.DateTimeFormat('en-GB', { month: 'long' }).format(calendarCursor);
        document.getElementById('calendar-month').textContent = new Intl.DateTimeFormat('en-GB', { month: 'long', year: 'numeric' }).format(calendarCursor).toUpperCase();
        document.getElementById('calendar-prev').disabled = calendarCursor <= calendarStart;
        document.getElementById('calendar-next').disabled = calendarCursor >= calendarEnd;
        grid.replaceChildren();
        ['M', 'T', 'W', 'T', 'F', 'S', 'S'].forEach((label) => {
          const weekday = document.createElement('span');
          weekday.className = 'weekday';
          weekday.textContent = label;
          grid.append(weekday);
        });
        const firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        for (let i = 0; i < firstDay; i += 1) {
          const blank = document.createElement('span');
          blank.className = 'day';
          blank.setAttribute('aria-hidden', 'true');
          grid.append(blank);
        }
        const query = searchInput.value.trim().toLowerCase();
        const datesWithEvents = new Set(events.filter((event) => {
          const matchesCategory = activeCategories.size === 0 || activeCategories.has(categoryFor(event));
          const haystack = `${event.title} ${event.venue} ${event.area || ''} ${event.description || ''}`.toLowerCase();
          return matchesCategory && (!query || haystack.includes(query));
        }).map((event) => event.dateISO));
        for (let day = 1; day <= daysInMonth; day += 1) {
          const dateISO = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const button = document.createElement('button');
          button.className = `day${datesWithEvents.has(dateISO) ? ' has-events' : ''}`;
          button.type = 'button';
          button.textContent = String(day);
          button.setAttribute('aria-pressed', String(selectedDate === dateISO));
          button.setAttribute('aria-label', `${day} ${monthName} ${year}${datesWithEvents.has(dateISO) ? ', events listed' : ''}`);
          button.addEventListener('click', () => {
            selectedDate = selectedDate === dateISO ? '' : dateISO;
            visibleLimit = pageSize;
            document.getElementById('home-view').hidden = false;
            document.getElementById('calendar-view').hidden = true;
            setActiveNav('home');
            renderCalendar();
            renderEvents();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
          grid.append(button);
        }
      }

      function setActiveNav(view) {
        const home = view === 'home';
        document.getElementById('home-view').hidden = !home;
        document.getElementById('calendar-view').hidden = home;
        document.getElementById('category-bar').parentElement.hidden = !home;
        if (home) {
          document.getElementById('nav-home').setAttribute('aria-current', 'page');
          document.getElementById('nav-calendar').removeAttribute('aria-current');
        } else {
          document.getElementById('nav-calendar').setAttribute('aria-current', 'page');
          document.getElementById('nav-home').removeAttribute('aria-current');
        }
        if (!home) renderCalendar();
      }

      loadMoreButton.addEventListener('click', () => {
        visibleLimit += pageSize;
        renderEvents();
      });
      categoryButtons.forEach((button) => button.addEventListener('click', () => {
        visibleLimit = pageSize;
        const category = button.dataset.category;
        if (category === 'All') {
          activeCategories.clear();
        } else if (activeCategories.has(category)) {
          activeCategories.delete(category);
        } else {
          activeCategories.add(category);
        }
        syncCategoryButtons();
        renderCalendar();
        renderEvents();
      }));
      searchInput.addEventListener('input', () => {
        visibleLimit = pageSize;
        renderEvents();
      });
      document.getElementById('refresh-button').addEventListener('click', loadEvents);
      document.getElementById('nav-home').addEventListener('click', () => setActiveNav('home'));
      document.getElementById('nav-calendar').addEventListener('click', () => setActiveNav('calendar'));
      document.getElementById('calendar-prev').addEventListener('click', () => {
        calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() - 1, 1);
        renderCalendar();
      });
      document.getElementById('calendar-next').addEventListener('click', () => {
        calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() + 1, 1);
        renderCalendar();
      });
      document.getElementById('clear-date').addEventListener('click', () => {
        selectedDate = '';
        visibleLimit = pageSize;
        renderCalendar();
        setActiveNav('home');
        renderEvents();
      });
      loadEvents();
    </script>
  </body>
</html>
