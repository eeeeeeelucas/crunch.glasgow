<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUNCH GLASGOW</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            crunch: {
              bg: '#050b14',
              card: '#0a1424',
              border: '#162844',
              accent: '#ff2a6d',
              yellow: '#FACC15'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #050b14; color: #F9FAFB; font-family: system-ui, -apple-system, sans-serif; }
    .pixel-border { border: 1px solid #162844; box-shadow: inset 0 0 0 1px #0a1424; }
    .pixel-border:hover { border-color: #ff2a6d; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 antialiased">

  <!-- TOP HEADER -->
  <header class="w-full max-w-md flex items-center justify-between mb-6 px-1">
    <div class="flex items-center gap-2 cursor-pointer" onclick="resetView()">
      <span class="text-xs font-mono text-gray-500 tracking-widest uppercase">CRUNCH.GLASGOW</span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="toggleModal('add-event-modal')" class="text-xs font-mono text-gray-400 hover:text-white px-2.5 py-1 pixel-border rounded bg-crunch-card">
        + SUBMIT
      </button>
    </div>
  </header>

  <!-- MAIN DASHBOARD CONTAINER -->
  <main class="w-full max-w-md space-y-3 flex-1 flex flex-col justify-center">

    <!-- SECTION TITLE -->
    <div class="text-[10px] font-mono tracking-widest text-gray-500 uppercase px-1">
      // NAVIGATION
    </div>

    <!-- GRID MENU -->
    <div class="grid grid-cols-2 gap-3">
      <!-- UPCOMING / ALL EVENTS -->
      <button onclick="openFeed('all')" class="pixel-border bg-crunch-card p-5 text-left rounded transition-all group flex flex-col justify-between h-28">
        <span class="text-crunch-accent font-mono text-lg">↓</span>
        <div>
          <h2 class="text-xs font-mono font-bold tracking-wider text-gray-100 group-hover:text-crunch-accent transition-colors">ALL EVENTS</h2>
          <p class="text-[10px] font-mono text-gray-500 mt-0.5">Glasgow listings</p>
        </div>
      </button>

      <!-- CLUB NIGHTS -->
      <button onclick="openFeed('Club Night')" class="pixel-border bg-crunch-card p-5 text-left rounded transition-all group flex flex-col justify-between h-28">
        <span class="text-crunch-accent font-mono text-lg">⚡</span>
        <div>
          <h2 class="text-xs font-mono font-bold tracking-wider text-gray-100 group-hover:text-crunch-accent transition-colors">CLUB NIGHTS</h2>
          <p class="text-[10px] font-mono text-gray-500 mt-0.5">DJs & electronic</p>
        </div>
      </button>

      <!-- LIVE MUSIC -->
      <button onclick="openFeed('Live Music')" class="pixel-border bg-crunch-card p-5 text-left rounded transition-all group flex flex-col justify-between h-28">
        <span class="text-crunch-accent font-mono text-lg">🎸</span>
        <div>
          <h2 class="text-xs font-mono font-bold tracking-wider text-gray-100 group-hover:text-crunch-accent transition-colors">LIVE MUSIC</h2>
          <p class="text-[10px] font-mono text-gray-500 mt-0.5">Gigs & bands</p>
        </div>
      </button>

      <!-- DIY / UNDERGROUND -->
      <button onclick="openFeed('DIY / Underground')" class="pixel-border bg-crunch-card p-5 text-left rounded transition-all group flex flex-col justify-between h-28">
        <span class="text-crunch-accent font-mono text-lg">🏴󠁧󠁢󠁳󠁣󠁴󠁿</span>
        <div>
          <h2 class="text-xs font-mono font-bold tracking-wider text-gray-100 group-hover:text-crunch-accent transition-colors">DIY / UNDERGROUND</h2>
          <p class="text-[10px] font-mono text-gray-500 mt-0.5">Basements & punk</p>
        </div>
      </button>
    </div>

    <!-- FULL WIDTH BOTTOM ACTION -->
    <button onclick="toggleModal('add-event-modal')" class="w-full pixel-border bg-crunch-card p-4 rounded text-left flex items-center justify-between group">
      <div class="flex items-center gap-3">
        <span class="text-crunch-accent font-mono text-lg">＋</span>
        <div>
          <h2 class="text-xs font-mono font-bold tracking-wider text-gray-100 group-hover:text-crunch-accent transition-colors">LIST AN EVENT</h2>
          <p class="text-[10px] font-mono text-gray-500">Promoters & venues submission</p>
        </div>
      </div>
      <span class="text-crunch-accent font-mono text-sm">↗</span>
    </button>

  </main>

  <!-- FOOTER -->
  <footer class="w-full max-w-md pt-6 pb-2 text-center text-[10px] font-mono text-gray-600">
    CRUNCH GLASGOW // 50P FEE MODEL
  </footer>

  <!-- EVENTS FEED VIEW MODAL / OVERLAY -->
  <div id="feed-modal" class="fixed inset-0 bg-[#050b14]/95 backdrop-blur-md z-50 hidden flex flex-col p-4 sm:p-6 overflow-y-auto">
    <div class="max-w-md w-full mx-auto flex-1 flex flex-col">
      <div class="flex items-center justify-between pb-4 border-b border-crunch-border mb-4">
        <div>
          <h2 id="feed-modal-title" class="text-xs font-mono tracking-widest text-crunch-accent uppercase">EVENTS</h2>
          <p class="text-[10px] font-mono text-gray-500 mt-0.5" id="feed-count">0 items</p>
        </div>
        <button onclick="closeFeed()" class="text-xs font-mono text-gray-400 hover:text-white px-3 py-1.5 pixel-border rounded bg-crunch-card">
          [ESC] CLOSE
        </button>
      </div>

      <!-- Search & Date Filter inside Feed -->
      <div class="space-y-2 mb-4">
        <input type="text" id="feed-search" onkeyup="renderFeedEvents()" placeholder="Search title, venue..." class="w-full bg-crunch-card pixel-border rounded px-3 py-2 text-xs font-mono text-gray-200 focus:outline-none focus:border-crunch-accent" />
        <input
