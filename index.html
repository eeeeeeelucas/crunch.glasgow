<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUNCH GLASGOW — Gigs & Nightlife Guide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            crunch: {
              bg: '#050b14',
              card: '#0d192b',
              border: '#1a2e4a',
              yellow: '#FACC15',
              accent: '#ff2a6d'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #050b14; color: #F9FAFB; font-family: system-ui, -apple-system, sans-serif; padding-bottom: 70px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- TOP APP HEADER -->
  <header class="border-b border-crunch-border bg-crunch-bg/95 backdrop-blur sticky top-0 z-40 px-4 py-3">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo('home')">
        <div class="h-8 w-8 rounded bg-crunch-yellow text-black font-black flex items-center justify-center text-lg tracking-tighter">
          C!
        </div>
        <div>
          <h1 class="text-base font-black tracking-tight text-gray-100 leading-none">
            CRUNCH <span class="text-crunch-yellow font-light">GLASGOW</span>
          </h1>
          <p class="text-[9px] font-mono text-gray-400 uppercase tracking-widest mt-0.5">Glasgow Event listings</p>
        </div>
      </div>
      <button onclick="toggleModal('add-event-modal')" class="bg-crunch-yellow hover:bg-yellow-300 text-black text-xs font-bold px-3 py-1.5 rounded transition-colors flex items-center gap-1">
        <span>+ List Event</span>
      </button>
    </div>
  </header>

  <!-- CATEGORY FILTER BAR (STICKY BELOW HEADER) -->
  <div class="border-b border-crunch-border bg-crunch-bg/90 backdrop-blur sticky top-[53px] z-30 px-4 py-2.5">
    <div class="max-w-2xl mx-auto flex items-center gap-2 overflow-x-auto no-scrollbar" id="category-bar">
      <button onclick="setCategory('All')" class="cat-btn active border border-crunch-yellow bg-crunch-yellow text-black text-xs font-bold px-3 py-1 rounded-full whitespace-nowrap transition-all">
        All Events
      </button>
      <button onclick="setCategory('Live Music')" class="cat-btn border border-crunch-border bg-crunch-card text-gray-300 hover:text-white text-xs font-medium px-3 py-1 rounded-full whitespace-nowrap transition-all">
        🎸 Live Music
      </button>
      <button onclick="setCategory('Clubs')" class="cat-btn border border-crunch-border bg-crunch-card text-gray-300 hover:text-white text-xs font-medium px-3 py-1 rounded-full whitespace-nowrap transition-all">
        ⚡ Clubs
      </button>
      <button onclick="setCategory('Theatre')" class="cat-btn border border-crunch-border bg-crunch-card text-gray-300 hover:text-white text-xs font-medium px-3 py-1 rounded-full whitespace-nowrap transition-all">
        🎭 Theatre
      </button>
      <button onclick="setCategory('Stand-Up Comedy')" class="cat-btn border border-crunch-border bg-crunch-card text-gray-300 hover:text-white text-xs font-medium px-3 py-1 rounded-full whitespace-nowrap transition-all">
        🎤 Stand-Up Comedy
      </button>
      <button onclick="setCategory('Workshops')" class="cat-btn border border-crunch-border bg-crunch-card text-gray-300 hover:text-white text-xs font-medium px-3 py-1 rounded-full whitespace-nowrap transition-all">
        🎨 Workshops
      </button>
    </div>
  </div>

  <!-- VIEW 1: HOMEPAGE / LISTINGS -->
  <main id="view-home" class="flex-1 max-w-2xl w-full mx-auto px-4 py-4 space-y-4">
    <!-- Search Bar -->
    <div class="relative">
      <input type="text" id="search-input" onkeyup="renderFeed()" placeholder="Search bands, DJs, venues..." class="w-full bg-crunch-card border border-crunch-border rounded-lg px-3.5 py-2 text-xs text-gray-200 placeholder-gray-500 focus:outline-none focus:border-crunch-yellow" />
    </div>

    <!-- Active Filter Status Indicator -->
    <div class="flex items-center justify-between text-xs text-gray-400 font-
