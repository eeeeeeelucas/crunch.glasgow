<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUNCH GLASGOW</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            crunch: {
              bg: '#050b14', // Deep slate background
              card: '#0a1424', // Card background
              border: '#162844', // Slate-blue pixel border
              accent: '#ff2a6d', // High-contrast pink
              yellow: '#FACC15'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #050b14; color: #F9FAFB; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; padding-bottom: 75px; }
    /* Pixel border style inspired by reference image */
    .pixel-border { border: 1px solid #162844; box-shadow: inset 0 0 0 1px #0a1424; }
    .pixel-border:hover { border-color: #ff2a6d; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 antialiased">

  <!-- VIEW 1: HOMEPAGE / GIG FEED -->
  <main id="view-home" class="w-full max-w-md space-y-3 flex-1 flex flex-col">
    
    <!-- TOP APP HEADER -->
    <header class="flex items-center justify-between px-1">
      <div class="flex items-center gap-2 cursor-pointer" onclick="resetView()">
        <span class="text-xs font-mono tracking-widest text-gray-500 uppercase">CRUNCH.GLASGOW</span>
      </div>
      <button onclick="toggleModal('add-event-modal')" class="text-[10px] font-mono text-gray-400 hover:text-white px-2.5 py-1 pixel-border rounded bg-crunch-card">
        + SUBMIT
      </button>
    </header>

    <!-- CATEGORY FILTER BAR (STICKY BELOW HEADER) -->
    <div class="border-b border-crunch-border bg-crunch-bg sticky top-[45px] z-30 py-2">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar" id="category-bar">
        <button onclick="setCategory('All')" id="cat-btn-All" class="px-3 py-1 text-[10px] uppercase font-bold rounded pixel-border bg-crunch-accent text-black border-crunch-accent whitespace-nowrap">
          All Events
        </button>
        <button onclick="setCategory('Live Music')" id="cat-btn-Live Music" class="px-3 py-1 text-[10px] uppercase font-bold rounded pixel-border bg-crunch-card text-gray-400 hover:text-white whitespace-nowrap">
          🎸 Live Music
        </button>
        <button onclick="setCategory('Clubs')" id="cat-btn-Clubs" class="px-3 py-1 text-[10px] uppercase font-bold rounded pixel-border bg-crunch-card text-gray-400 hover:text-white whitespace-nowrap">
          ⚡ Clubs
        </button>
        <button onclick="setCategory('Theatre')" id="cat-btn-Theatre" class="px-3 py-1 text-[10px] uppercase font-bold rounded pixel-border bg-crunch-card text-gray-400 hover:text-white whitespace-nowrap">
          🎭 Theatre
        </button>
        <button onclick="setCategory('Comedy')" id="cat-btn-Comedy" class="px-3 py-1 text-[10px] uppercase font-bold rounded pixel-border bg-crunch-card text-gray-400 hover:text-white whitespace-nowrap">
          🎤 Stand-Up
        </button>
        <button onclick="setCategory('Workshops')" id="cat-btn-Workshops" class="px-3 py-1 text-[10px] uppercase font-bold rounded pixel-border bg-crunch-card text-gray-400 hover:text-white whitespace-nowrap">
          🎨 Workshops
        </button>
      </div>
    </div>

    <!-- FEED BODY -->
    <div class="space-y-3 flex-1">
      
      <!-- Search Bar -->
      <input type="text" id="search-input" onkeyup="renderFeed()" placeholder="// Search band, venue..." class="w-full bg-crunch-card pixel-border rounded px-3 py-1.5 text-xs text-gray-200 placeholder-gray-600 focus:outline-none focus:border-crunch-accent" />

      <!-- Active Filter Status -->
      <div class="flex items-center justify-between text-[10px] text-gray-500 uppercase px-1">
        <span id="filter-status-label">// UPCOMING LISTINGS</span>
        <span id="event-count-badge">0 ITEMS</span>
      </div>

      <!-- Active Date Filter Pill (Hidden by default) -->
      <div id="active-date-pill" class="hidden flex items-center justify-between bg-crunch-card pixel-border rounded px-3 py-1.5 text-xs">
        <span class="text-crunch-accent text-[10px]" id="active-date-text">Filtered by date</span>
        <button onclick="clearDateFilter()" class="text-gray-400 hover:text-white text-[10px]">[✕ CLEAR DATE]</button>
      </div>

      <!-- Events List -->
      <div id="events-grid" class="space-y-3 pb-6 feed-scroll">
        <!-- Dynamic Event Cards Injected Here via JS -->
      </div>
    </div>
  </main>

  <!-- VIEW 2: CALENDAR PAGE -->
  <main id="view-calendar" class="hidden w-full max-w-md space-y-3 flex-1 flex flex-col justify-center">
    <header class="flex items-center justify-between px-1">
      <div class="flex items-center gap-2 cursor-pointer" onclick="resetView()">
        <span class="text-xs font-mono tracking-widest text-gray-500 uppercase">CRUNCH.GLASGOW</span>
      </div>
    </header>

    <div class="pixel-border bg-crunch-card p-4 rounded space-y-4">
      <div class="flex items-center justify-between mb-3 border-b border-crunch-border pb-2">
        <h2 class="text-xs font-mono uppercase text-crunch-accent font-bold tracking-widest">// CALENDAR NAVIGATION</h2>
        <span class="text-xs font-mono text-gray-400">NOVEMBER 2026</span>
      </div>

      <!-- Simple Month Grid -->
      <div class="grid grid-cols-7 gap-1 text-center font-mono text-[10px] text-gray-500 mb-2 font-bold uppercase">
        <div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center font-mono text-xs" id="calendar-days">
        <!-- Dynamic Month Days Injected Here -->
      </div>
    </div>

    <!-- Specfic Date Picker Input -->
    <div class="pixel-border bg-crunch-card p-3 rounded flex items-center justify-between text-xs">
      <label class="text-[10px] text-gray-400 font-mono uppercase tracking-wider">Custom Date Picker:</label>
      <input type="date" id="calendar-date-picker" onchange="selectDateFromPicker(this.value)" class="bg-crunch-bg pixel-border rounded px-2 py-1 text-xs text-gray-200 focus:outline-none focus:border-crunch-accent" />
    </div>
  </main>

  <!-- TICKET BOOKING MODAL -->
  <div id="ticket-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-crunch-card pixel-border rounded max-w-xs w-full p-4 relative font-mono text-xs">
      <button onclick="toggleModal('ticket-modal')" class="absolute top-2 right-2 text-gray-500 hover:text-white text-xs">[✕]</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- PROMOTER EVENT SUBMISSION MODAL -->
  <div id="add-event-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-crunch-card pixel-border rounded max-w-md w-full p-4 relative font-mono max-h-[90vh] overflow-y-auto text-xs">
      <button onclick="toggleModal('add-event-modal')" class="absolute top-2 right-2 text-gray-500 hover:text-white text-xs">[✕]</button>
      <h3 class="text-xs font-bold text-crunch-accent uppercase tracking-widest mb-1">// SUBMIT LISTING</h3>
      <p class="text-[10px] text-gray-500 mb-3">Direct submission for Glasgow venues & promoters.</p>
      
      <form onsubmit="handleCreateEvent(event)" class="space-y-2">
        <div>
          <label class="block text-[10px] text-gray-400 mb-0.5">EVENT TITLE</label>
          <input type="text" id="new-title" required placeholder="e.g. Subculture w/ Wheats" class="w-full bg-crunch-bg pixel-border rounded p-1.5 text-gray-100 focus:border-crunch-accent focus:outline-none"/>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] text-gray-400 mb-0.5">VENUE</label>
            <input type="text" id="new-venue" required placeholder="Sub Club" class="w-full bg-crunch-bg pixel-border rounded p-1.5 text-gray-100 focus:border-crunch-accent focus:outline-none"/>
          </div>
          <div>
            <label class="block text-[10px] text-gray-400 mb-0.5">AREA</label>
            <select id="new-area" class="w-full bg-crunch-bg pixel-border rounded p-1.5 text-gray-100 focus:border-crunch-accent focus:outline-none">
              <option value="City Centre">City Centre</option>
              <option value="West End">West End</option>
              <option value="Southside">Southside</option>
              <option value="East End">East End</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] text-gray-400 mb-0.5">DATE & TIME</label>
            <input type="datetime-local" id="new-date" required class="w-full bg-crunch-bg pixel-border rounded p-1.5 text-gray-100 focus:border-crunch-accent focus:outline-none"/>
          </div>
          <div>
            <label class="block text-[10px] text-gray-400 mb-0.5">CATEGORY</label>
            <select id="new-category" class="w-full bg-crunch-bg pixel-border rounded p-1.5 text-gray-100 focus:border-crunch-accent focus:outline-none">
              <option value="Live Music">Live Music</option>
              <option value="Clubs">Clubs</option>
              <option value="Theatre">Theatre</option>
              <option value="Comedy">Comedy</option>
              <option value="Workshops">Workshops</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] text-gray-400 mb-0.5">TICKET PRICE (£)</label>
            <input type="number" step="0.50" id="new-price" required placeholder="10.00" class="w-full bg-crunch-bg pixel-border rounded p-1.5 text-gray-100 focus:border-crunch-accent focus:outline-none"/>
          </div>
          <div>
            <label class="block text-[10px] text-gray-400 mb-0.5">BOOKING FEE</label>
            <input type="text" disabled value="£0.50" class="w-full bg-crunch-bg pixel-border rounded p-1.5 text-gray-600"/>
          </div>
        </div>
        <div>
          <label class="block text-[10px] text-gray-400 mb-0.5">PHOTO URL</label>
          <input type="url" id="new-image" placeholder="https://..." class="w-full bg-crunch-bg pixel-border rounded p-1.5 text-gray-100 focus:border-crunch-accent focus:outline-none"/>
        </div>
        <div>
          <label class="block text-[10px] text-gray-400 mb-0.5">DESCRIPTION</label>
          <textarea id="new-desc" rows="2" required placeholder="Event description..." class="w-full bg-crunch-bg pixel-border rounded p-1.5 text-gray-100 focus:border-crunch-accent focus:outline-none"></textarea>
        </div>
        <button type="submit" class="w-full pixel-border bg-crunch-accent text-black font-bold py-2 rounded uppercase tracking-wider hover:opacity-90 mt-1">
          PUBLISH EVENT
        </button>
      </form>
    </div>
  </div>

        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>HOME</span>
      </button>
      <button onclick="navigateTo('calendar')" id="nav-calendar" class="flex flex-col items-center gap-1.5 text-gray-500 hover:text-white">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span>CALENDAR</span>
      </button>
    </div>
  </nav>

    // View Navigation System
    function navigateTo(viewName) {
      const homeView = document.getElementById('view-home');
      const calendarView = document.getElementById('view-calendar');
      const navHome = document.getElementById('nav-home');
      const navCalendar = document.getElementById('nav-calendar');

      if (viewName === 'home') {
        homeView.classList.remove('hidden');
        calendarView.classList.add('hidden');
        navHome.className = 'flex flex-col items-center gap-1.5 text-crunch-accent font-bold';
        navCalendar.className = 'flex flex-col items-center gap-1.5 text-gray-500 hover:text-white';
        renderFeed();
      } else if (viewName === 'calendar') {
        homeView.classList.add('hidden');
        calendarView.classList.remove('hidden');
        navCalendar.className = 'flex flex-col items-center gap-1.5 text-crunch-accent font-bold';
