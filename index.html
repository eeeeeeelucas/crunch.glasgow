<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUNCH GLASGOW — Gigs & Nightlife Guide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            crunch: {
              bg: '#050b14',
              card: '#0d192b',
              border: '#1a2e4a',
              yellow: '#FACC15',
              accent: '#ff2a6d'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #050b14; color: #F9FAFB; font-family: system-ui, -apple-system, sans-serif; padding-bottom: 75px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- APP TOP HEADER -->
  <header class="border-b border-crunch-border bg-crunch-bg/95 backdrop-blur sticky top-0 z-40 px-4 py-3">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo('home')">
        <div class="h-8 w-8 rounded bg-crunch-yellow text-black font-black flex items-center justify-center text-lg tracking-tighter">
          C!
        </div>
        <div>
          <h1 class="text-base font-black tracking-tight text-gray-100 leading-none">
            CRUNCH <span class="text-crunch-yellow font-light">GLASGOW</span>
          </h1>
          <p class="text-[9px] font-mono text-gray-400 uppercase tracking-widest mt-0.5">Glasgow Event listings</p>
        </div>
      </div>
      <button onclick="toggleModal('add-event-modal')" class="bg-crunch-yellow hover:bg-yellow-300 text-black text-xs font-bold px-3 py-1.5 rounded transition-colors">
        + List Event
      </button>
    </div>
  </header>

  <!-- CATEGORY FILTER BAR (PERMANENT TOP BAR) -->
  <div class="border-b border-crunch-border bg-crunch-bg/90 backdrop-blur sticky top-[53px] z-30 px-4 py-2.5">
    <div class="max-w-2xl mx-auto flex items-center gap-2 overflow-x-auto no-scrollbar" id="category-bar">
      <button onclick="setCategory('All')" id="cat-btn-All" class="cat-btn border border-crunch-yellow bg-crunch-yellow text-black text-xs font-bold px-3 py-1 rounded-full whitespace-nowrap transition-all">
        All Events
      </button>
      <button onclick="setCategory('Live Music')" id="cat-btn-Live Music" class="cat-btn border border-crunch-border bg-crunch-card text-gray-300 hover:text-white text-xs font-medium px-3 py-1 rounded-full whitespace-nowrap transition-all">
        🎸 Live Music
      </button>
      <button onclick="setCategory('Clubs')" id="cat-btn-Clubs" class="cat-btn border border-crunch-border bg-crunch-card text-gray-300 hover:text-white text-xs font-medium px-3 py-1 rounded-full whitespace-nowrap transition-all">
        ⚡ Clubs
      </button>
      <button onclick="setCategory('Theatre')" id="cat-btn-Theatre" class="cat-btn border border-crunch-border bg-crunch-card text-gray-300 hover:text-white text-xs font-medium px-3 py-1 rounded-full whitespace-nowrap transition-all">
        🎭 Theatre
      </button>
      <button onclick="setCategory('Stand-Up Comedy')" id="cat-btn-Stand-Up Comedy" class="cat-btn border border-crunch-border bg-crunch-card text-gray-300 hover:text-white text-xs font-medium px-3 py-1 rounded-full whitespace-nowrap transition-all">
        🎤 Stand-Up Comedy
      </button>
      <button onclick="setCategory('Workshops')" id="cat-btn-Workshops" class="cat-btn border border-crunch-border bg-crunch-card text-gray-300 hover:text-white text-xs font-medium px-3 py-1 rounded-full whitespace-nowrap transition-all">
        🎨 Workshops
      </button>
    </div>
  </div>

  <!-- VIEW 1: HOMEPAGE (LISTINGS) -->
  <main id="view-home" class="flex-1 max-w-2xl w-full mx-auto px-4 py-4 space-y-4">
    <!-- Search Bar -->
    <div class="relative">
      <input type="text" id="search-input" onkeyup="renderFeed()" placeholder="Search bands, DJs, venues..." class="w-full bg-crunch-card border border-crunch-border rounded-lg px-3.5 py-2 text-xs text-gray-200 placeholder-gray-500 focus:outline-none focus:border-crunch-yellow" />
    </div>

    <!-- Active Status Bar -->
    <div class="flex items-center justify-between text-xs text-gray-400 font-mono">
      <span id="filter-status-label">Upcoming Glasgow Events</span>
      <span id="event-count-badge">0 events</span>
    </div>

    <!-- Active Date Filter Banner -->
    <div id="active-date-pill" class="hidden flex items-center justify-between bg-crunch-card border border-crunch-yellow/50 rounded-lg px-3 py-2 text-xs">
      <span class="text-crunch-yellow font-medium" id="active-date-text">Filtered by date</span>
      <button onclick="clearDateFilter()" class="text-gray-400 hover:text-white font-bold text-xs bg-crunch-border/50 px-2 py-0.5 rounded">✕ Clear Date</button>
    </div>

    <!-- Event Cards Grid -->
    <div id="events-grid" class="space-y-4">
      <!-- Dynamic Event Cards Injected Here -->
    </div>
  </main>

  <!-- VIEW 2: CALENDAR PAGE -->
  <main id="view-calendar" class="hidden flex-1 max-w-2xl w-full mx-auto px-4 py-6">
    <div class="bg-crunch-card border border-crunch-border rounded-xl p-4 sm:p-6 mb-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xs font-bold tracking-wider text-gray-200 uppercase font-mono">// Select Date</h2>
        <span class="text-xs text-crunch-yellow font-mono font-bold">November 2026</span>
      </div>

      <!-- Calendar Days Header -->
      <div class="grid grid-cols-7 gap-1 text-center font-mono text-xs mb-2 text-gray-500 font-bold">
        <div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div>
      </div>
      <!-- Calendar Days Grid -->
      <div class="grid grid-cols-7 gap-1.5 text-center font-mono text-xs" id="calendar-days">
        <!-- Dynamic Month Days Injected Here -->
      </div>
    </div>

    <div class="bg-crunch-card border border-crunch-border rounded-xl p-4 flex items-center justify-between">
      <label class="text-xs text-gray-300 font-mono">Custom Date Picker:</label>
      <input type="date" id="calendar-date-picker" onchange="selectDateFromPicker(this.value)" class="bg-[#050b14] border border-crunch-border rounded px-3 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-crunch-yellow" />
    </div>
  </main>

  <!-- TICKET BOOKING MODAL -->
  <div id="ticket-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-crunch-card border border-crunch-border rounded-xl max-w-sm w-full p-5 relative">
      <button onclick="toggleModal('ticket-modal')" class="absolute top-3 right-3 text-gray-400 hover:text-white text-xs font-mono">[✕]</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- PROMOTER EVENT SUBMISSION MODAL -->
  <div id="add-event-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-crunch-card border border-crunch-border rounded-xl max-w-md w-full p-5 relative max-h-[90vh] overflow-y-auto">
      <button onclick="toggleModal('add-event-modal')" class="absolute top-3 right-3 text-gray-400 hover:text-white text-xs font-mono">[✕]</button>
      <h3 class="text-sm font-bold text-crunch-yellow uppercase font-mono mb-1">// Submit Event Listing</h3>
      <p class="text-xs text-gray-400 mb-4">Direct listing for Glasgow venues & promoters.</p>
      
      <form onsubmit="handleCreateEvent(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-gray-300 mb-1">Event Title</label>
          <input type="text" id="new-title" required placeholder="e.g. Subculture" class="w-full bg-[#050b14] border border-crunch-border rounded p-2 text-gray-100 focus:border-crunch-yellow focus:outline-none"/>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-gray-300 mb-1">Venue</label>
            <input type="text" id="new-venue" required placeholder="e.g. Sub Club" class="w-full bg-[#050b14] border border-crunch-border rounded p-2 text-gray-100 focus:border-crunch-yellow focus:outline-none"/>
          </div>
          <div>
            <label class="block text-gray-300 mb-1">Neighborhood</label>
            <select id="new-area" class="w-full bg-[#050b14] border border-crunch-border rounded p-2 text-gray-100 focus:border-crunch-yellow focus:outline-none">
              <option value="City Centre">City Centre</option>
              <option value="West End">West End</option>
              <option value="Southside">Southside</option>
              <option value="East End">East End</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-gray-300 mb-1">Date & Time</label>
            <input type="datetime-local" id="new-date" required class="w-full bg-[#050b14] border border-crunch-border rounded p-2 text-gray-100 focus:border-crunch-yellow focus:outline-none"/>
          </div>
          <div>
            <label class="block text-gray-300 mb-1">Category</label>
            <select id="new-category" class="w-full bg-[#050b14] border border-crunch-border rounded p-2 text-gray-100 focus:border-crunch-yellow focus:outline-none">
              <option value="Live Music">Live Music</option>
              <option value="Clubs">Clubs</option>
              <option value="Theatre">Theatre</option>
              <option value="Stand-Up Comedy">Stand-Up Comedy</option>
              <option value="Workshops">Workshops</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-gray-300 mb-1">Ticket Price (£)</label>
            <input type="number" step="0.50" id="new-price" required placeholder="10.00" class="w-full bg-[#050b14] border border-crunch-border rounded p-2 text-gray-100 focus:border-crunch-yellow focus:outline-none"/>
          </div>
          <div>
            <label class="block text-gray-300 mb-1">Booking Fee</label>
            <input type="text" disabled value="£0.50" class="w-full bg-[#050b14] border border-crunch-border rounded p-2 text-gray-500"/>
          </div>
        </div>
        <div>
          <label class="block text-gray-300 mb-1">Photo Image URL</label>
          <input type="url" id="new-image" placeholder="https://..." class="w-full bg-[#050b14] border border-crunch-border rounded p-2 text-gray-100 focus:border-crunch-yellow focus:outline-none"/>
        </div>
        <div>
          <label class="block text-gray-300 mb-1">Description</label>
          <textarea id="new-desc" rows="2" required placeholder="Event details..." class="w-full bg-[#050b14] border border-crunch-border rounded p-2 text-gray-100 focus:border-crunch-yellow focus:outline-none"></textarea>
        </div>
        <button type="submit" class="w-full bg-crunch-yellow text-black font-bold py-2.5 rounded hover:bg-yellow-300 transition-colors mt-2">
          Publish Event
        </button>
      </form>
    </div>
  </div>

  <!-- FIXED BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 border-t border-crunch-border bg-crunch-bg/95 backdrop-blur z-40 px-6 py-2">
    <div class="max-w-md mx-auto flex items-center justify-around text-xs font-medium">
      <button onclick="navigateTo('
