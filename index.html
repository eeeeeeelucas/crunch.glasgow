<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUNCH GLASGOW // Gigs & Nightlife Guide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            crunch: {
              bg: '#030712', // Pure Black
              card: '#0c1221', // Slate/Card background
              border: '#1f293a', // Visible borders
              pink: '#ff2d60', // Crucial accent/pink
              cyan: '#00d5ff'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #030712; color: #F9FAFB; font-family: system-ui, -apple-system, sans-serif; padding-bottom: 75px; }
    .pixel-border { border: 1px solid #1f293a; box-shadow: inset 0 0 0 1px #0c1221; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-crunch-pink/30">

  <!-- TOP HEADER -->
  <header class="border-b border-crunch-border bg-crunch-bg/95 backdrop-blur-sm sticky top-0 z-40 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo('home')">
        <span class="text-crunch-pink font-bold text-xl drop-shadow-[0_0_8px_rgba(255,45,96,0.6)]">C!</span>
        <h1 class="text-xs tracking-tight text-gray-100 font-black uppercase">
          CRUNCH<span class="text-crunch-pink">.GLASGOW</span>
        </h1>
      </div>
      <button onclick="toggleModal('add-event-modal')" class="text-xs font-semibold text-crunch-bg px-3 py-1.5 rounded-md bg-crunch-pink/90 hover:bg-crunch-pink transition-colors">
        + List Your Event
      </button>
    </div>
  </header>

  <!-- CATEGORY FILTER BAR (STICKY BELOW HEADER) -->
  <div class="border-b border-crunch-border bg-crunch-bg sticky top-[53px] z-30 px-4 py-2.5">
    <div class="max-w-md mx-auto flex items-center gap-2 overflow-x-auto no-scrollbar" id="category-bar">
      <button onclick="setCategory('All')" id="cat-btn-All" class="cat-btn px-4 py-1.5 text-xs uppercase font-bold rounded-full whitespace-nowrap transition-all border border-crunch-pink bg-crunch-pink text-crunch-bg">
        All Gigs
      </button>
      <button onclick="setCategory('Live Music')" id="cat-btn-Live Music" class="cat-btn px-4 py-1.5 text-xs uppercase font-bold rounded-full whitespace-nowrap transition-all border border-crunch-border bg-crunch-card text-gray-300 hover:text-white">
        🎸 Live Music
      </button>
      <button onclick="setCategory('Clubs')" id="cat-btn-Clubs" class="cat-btn px-4 py-1.5 text-xs uppercase font-bold rounded-full whitespace-nowrap transition-all border border-crunch-border bg-crunch-card text-gray-300 hover:text-white">
        ⚡ Clubs
      </button>
      <button onclick="setCategory('Theatre')" id="cat-btn-Theatre" class="cat-btn px-4 py-1.5 text-xs uppercase font-bold rounded-full whitespace-nowrap transition-all border border-crunch-border bg-crunch-card text-gray-300 hover:text-white">
        🎭 Theatre
      </button>
      <button onclick="setCategory('Stand-Up Comedy')" id="cat-btn-Stand-Up Comedy" class="cat-btn px-4 py-1.5 text-xs uppercase font-bold rounded-full whitespace-nowrap transition-all border border-crunch-border bg-crunch-card text-gray-300 hover:text-white">
        🎤 Stand-Up
      </button>
    </div>
  </div>

  <!-- VIEW 1: HOMEPAGE / GIG FEED -->
  <main id="view-home" class="flex-1 max-w-md w-full mx-auto px-4 py-4 space-y-4">
    <!-- Search Bar -->
    <div class="relative">
      <input type="text" id="search-input" onkeyup="renderFeed()" placeholder="Search bands, DJs, venues..." class="w-full bg-crunch-card border border-crunch-border rounded-xl px-4 py-2.5 text-xs text-gray-200 placeholder-gray-500 focus:outline-none focus:border-crunch-pink" />
    </div>

    <!-- Active Filter Status Indicator -->
    <div class="flex items-center justify-between text-[11px] text-gray-500 uppercase font-mono tracking-wider">
      <span id="filter-status-label">// UPCOMING LISTINGS</span>
      <span id="event-count-badge">0 events</span>
    </div>

    <!-- Active Date Filter Pill (Hidden by default) -->
    <div id="active-date-pill" class="hidden flex items-center justify-between bg-crunch-card border border-crunch-pink/50 rounded-lg px-3 py-2 text-xs">
      <span class="text-crunch-pink font-semibold" id="active-date-text">Filtered by date</span>
      <button onclick="clearDateFilter()" class="text-gray-400 hover:text-white text-xs">✕ Clear Date</button>
    </div>

    <!-- Events Grid -->
    <div id="events-grid" class="space-y-4">
      <!-- Dynamic Event Cards Injected Here via JS -->
    </div>
  </main>

  <!-- VIEW 2: CALENDAR PAGE -->
  <main id="view-calendar" class="hidden flex-1 max-w-md w-full mx-auto px-4 py-6">
    <div class="bg-crunch-card border border-crunch-border rounded-xl p-5 mb-6">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-crunch-border">
        <h2 class="text-sm font-bold tracking-wider text-gray-200 uppercase font-mono">// Select Date</h2>
        <span class="text-xs text-crunch-pink font-bold font-mono">November 2026</span>
      </div>

      <!-- Days Grid Header -->
      <div class="grid grid-cols-7 gap-1 text-center font-mono text-[11px] mb-2 text-gray-600 font-bold">
        <div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div>
      </div>
      <!-- Days Grid -->
      <div class="grid grid-cols-7 gap-2 text-center font-mono text-xs" id="calendar-days">
        <!-- Injected days via JS -->
      </div>
    </div>

    <!-- Quick Date Selector Input -->
    <div class="bg-crunch-card border border-crunch-border rounded-xl p-4 flex items-center justify-between">
      <label class="text-xs text-gray-300 font-mono">Or pick specific date:</label>
      <input type="date" id="calendar-date-picker" onchange="selectDateFromPicker(this.value)" class="bg-[#030712] border border-crunch-border rounded px-3 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-crunch-pink" />
    </div>
  </main>

  <!-- FIXED BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 border-t border-crunch-border bg-crunch-bg/95 backdrop-blur-sm z-40 px-6 py-2">
    <div class="max-w-md mx-auto flex items-center justify-around text-xs font-medium">
      <button onclick="navigateTo('home')" id="nav-home" class="flex flex-col items-center gap-1.5 text-crunch-pink font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Home</span>
      </button>
      <button onclick="navigateTo('calendar')" id="nav-calendar" class="flex flex-col items-center gap-1.5 text-gray-400 hover:text-white">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span>Calendar</span>
      </button>
    </div>
  </nav>

  <!-- Modals and JS continue below (OMITTED FOR BREVITY - FULL FILE REQUIRED) -->

</body>
</html>
